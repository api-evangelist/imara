name: Imara
description: Imara Corporation was a lithium-ion battery technology startup founded in 2006 in Menlo Park,
  California, that grew out of research at SRI International. It designed and manufactured high-power
  lithium-ion battery cells and packs based on patented cathode materials science, targeting power tools,
  outdoor power equipment, hybrid electric vehicles, specialty applications, and power-grid energy storage.
  Backed by Battery Ventures and Nth Power, it raised roughly $15.65M and reached commercial cell production
  in 2009 before shutting down around 2010-2011 for lack of manufacturing funding. It is a hardware company
  with no public API, developer portal, or documentation surface, and is now defunct.
